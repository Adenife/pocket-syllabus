services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - library:/var/lib/pocket
      - models:/home/pocket/.cache
    environment:
      POCKET_AUTH_ENABLED: "1"
      POCKET_REGISTRATION_ENABLED: "${POCKET_REGISTRATION_ENABLED:-1}"
      POCKET_ENCRYPTION_KEY: "${POCKET_ENCRYPTION_KEY:-}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      POCKET_API_URL: http://api:8000/api/v1
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  library:
  models:
